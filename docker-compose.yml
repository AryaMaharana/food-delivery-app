services:
  postgres:
    image: postgres:17
    container_name: food-delivery-postgres
    environment:
      POSTGRES_DB: fooddelivery
      POSTGRES_USER: fooddelivery
      POSTGRES_PASSWORD: fooddelivery
    ports:
      - "5432:5432"
    volumes:
      - fooddelivery_pgdata:/var/lib/postgresql/data
volumes:
  fooddelivery_pgdata:
