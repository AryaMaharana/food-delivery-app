server: { port: 8080 }
spring:
  application: { name: api-gateway }
  cloud:
    gateway:
      discovery.locator.enabled: true
      discovery.locator.lower-case-service-id: true
      routes:
        - id: auth
          uri: lb://AUTH-SERVICE
          predicates: [ Path=/api/auth/** ]
        - id: restaurants
          uri: lb://RESTAURANT-SERVICE
          predicates: [ Path=/api/restaurants/** ]
        - id: orders
          uri: lb://ORDER-SERVICE
          predicates: [ Path=/api/orders/** ]
eureka:
  client:
    service-url: { defaultZone: http://localhost:8761/eureka/ }
management:
  endpoints.web.exposure.include: health,info,gateway
app:
  jwt:
    secret: ${JWT_SECRET:change-this-local-secret-to-a-long-random-value-123456789}
