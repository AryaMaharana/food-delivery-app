server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/fooddelivery
    username: fooddelivery
    password: fooddelivery
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-local-secret-to-a-long-random-value-123456789}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    metadata-map:
      module-enabled: "true"
      module-name: "auth"
      ui-enabled: "false"
